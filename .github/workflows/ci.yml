name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: gates (lint + test + catalog + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # gitleaks binary for the secrets step
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks || mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Lint (ruff)
        run: ruff check backend catalog tests

      - name: Format check (black)
        run: black --check backend catalog tests

      - name: Unit tests + coverage
        run: pytest tests/ -v --cov=backend --cov=catalog --cov-report=term-missing --cov-fail-under=80

      - name: Catalog validation
        run: python catalog/validate.py --all

      - name: Secrets scan (gitleaks)
        run: gitleaks detect --no-git --source . --redact

      - name: Backend smoke (healthz)
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8765 &
          UV_PID=$!
          sleep 3
          curl -sf -o /dev/null -w "healthz=%{http_code}\n" http://127.0.0.1:8765/healthz
          curl -sf -o /dev/null -w "readyz=%{http_code}\n" http://127.0.0.1:8765/readyz
          kill $UV_PID || true

      - name: Docker build + smoke (sin push)
        run: |
          set -euo pipefail
          docker build --target runtime -t cam-chile:test .
          docker images cam-chile:test --format "{{.Repository}}:{{.Tag}} {{.Size}}"
          cleanup() { docker stop camchile-ci 2>/dev/null || true; }
          trap cleanup EXIT
          docker run --rm -d --name camchile-ci -p 127.0.0.1:8765:8000 cam-chile:test
          sleep 4
          curl --fail --silent --show-error -o /dev/null -w "healthz=%{http_code}\n" http://127.0.0.1:8765/healthz
          echo "docker-smoke=ok"

      - name: Summary
        if: always()
        run: 'echo "CI run finished with status: ${{ job.status }}"'