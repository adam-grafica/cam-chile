# CAM-CHILE — nginx.conf mínimo (uso local vía docker-compose)
#
# Características:
# - Sirve estáticos de /app/frontend en / (host local)
# - Headers de seguridad: X-Content-Type-Options, Referrer-Policy, X-Frame-Options
# - Gzip en respuestas JSON/HTML
# - Rate limit por IP (zona limit_req_zone, ~60 req/s con burst 20)
# - NO incluye TLS termination, NO proxy_pass externo (esos requieren ADR)
# - NO expone 0.0.0.0 — solo escucha en la red interna de docker-compose
#
# ADR-0003: este archivo NO se usa para exposición pública. Solo local.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 256;
}

http {
    # ─── Configuración base ────────────────────────────────────────
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # ─── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ─── Rate limit por IP ─────────────────────────────────────────
    # ~60 req/s promedio, burst 20 — razonable para dev. Ajustar por ADR si se endurece.
    limit_req_zone $binary_remote_addr zone=camchile_rl:10m rate=60r/s;
    limit_req_status 429;

    # ─── Server ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Rate limit
        limit_req zone=camchile_rl burst=20 nodelay;

        # ─── Headers de seguridad ──────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        # ─── Estáticos ──────────────────────────────────────────────
        root /app/frontend;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(html|css|js|svg|png|jpg|jpeg|ico)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Health check local (sin rate limit para /healthz del LB).
        location = /nginx-healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}