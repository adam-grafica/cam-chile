<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="http://localhost:8000">
    <meta name="allowed-hosts" content="youtube.com,youtu.be,youtube-nocookie.com,webcams.travel,skylinewebcams.com">
    <title>CAM-CHILE — Mapa de cámaras públicas</title>

    <!-- Leaflet CSS (CDN pinneado a versión fija para CSP estricta futura) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">

    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="map" role="application" aria-label="Mapa de cámaras públicas de Chile"></div>

    <aside class="info-panel" aria-label="Información del catálogo">
        <h1>📹 CAM-CHILE</h1>
        <p class="tagline">Cámaras públicas y autorizadas</p>
        <div class="stat">
            <span class="stat-label">Activas:</span>
            <span class="stat-value" id="count">Cargando…</span>
        </div>
        <div class="filters" role="group" aria-label="Filtros">
            <label>
                <span>Región</span>
                <select id="filter-region" aria-label="Filtrar por región">
                    <option value="">Todas</option>
                </select>
            </label>
            <label>
                <span>Fuente</span>
                <select id="filter-source" aria-label="Filtrar por fuente">
                    <option value="">Todas</option>
                </select>
            </label>
            <label>
                <span>Estado</span>
                <select id="filter-status" aria-label="Filtrar por estado público">
                    <option value="">Todos</option>
                    <option value="declared_public">declared_public</option>
                    <option value="unknown">unknown</option>
                    <option value="revoked">revoked</option>
                </select>
            </label>
        </div>
        <p class="loading" id="status-line">Cargando cámaras…</p>
    </aside>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

    <script src="./config.js"></script>
    <script src="./map.js"></script>
    <script src="./player.js"></script>
    <script src="./filters.js"></script>
</body>
</html>
